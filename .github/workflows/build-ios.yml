# Build .ipa CHƯA KÝ bằng macOS runner. Chạy tay (Actions -> Build iOS -> Run workflow).
# CHƯA CHẠY THỬ: khi chạy lần đầu hãy đọc log và chỉnh theo lỗi thực tế.
name: Build iOS (unsigned IPA)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Biến thể build'
        type: choice
        options:
          - production
          - development
        default: production

permissions:
  contents: read

jobs:
  # Kiểm tra rẻ trên Linux (hệ số 1) trước khi bật macOS (hệ số 10), tránh đốt phút khi thiếu app
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra apps/mobile đã tồn tại
        run: |
          set -euo pipefail
          if [ ! -f apps/mobile/package.json ]; then
            echo "::error::Chưa có apps/mobile/package.json. App Expo được thêm ở bước spike player của Phase 0, chưa build được."
            exit 1
          fi

  build:
    needs: preflight
    # Ghim nhãn macos-26 thay vì macos-latest để nhãn không tự chuyển sang image mới (có thể dùng Xcode 27).
    runs-on: macos-26
    # Repo private: 1 phút macOS = 10 phút hạn mức. 35 phút chặn tối đa khoảng 350 phút nếu build treo.
    # Nếu build thật sự dài hơn, tăng sau khi đã đo được thời gian chạy thực tế.
    timeout-minutes: 35
    env:
      APP_VARIANT: ${{ inputs.variant }}
      EXPO_PUBLIC_BUILD_SHA: ${{ github.sha }} # hiển thị ở màn hình Debug
    steps:
      - uses: actions/checkout@v4

      # Phiên bản pnpm lấy từ trường "packageManager" trong package.json gốc
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cài dependencies
        run: pnpm install --frozen-lockfile

      # Ghim Xcode 26.6: app build bằng SDK iOS 27 (Xcode 27) cần UIScene, chưa dùng ở dự án này.
      # Đường dẫn lấy từ danh sách phần mềm image macos-26 (runner-images, image 20260831): /Applications/Xcode_26.6.app
      - name: Chọn Xcode
        run: |
          set -euo pipefail
          XCODE_APP="/Applications/Xcode_26.6.app"
          ls /Applications | grep -i '^Xcode' || true
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::Không thấy $XCODE_APP trên runner. Xem danh sách Xcode ở trên rồi báo người phụ trách, KHÔNG tự đổi sang Xcode 27."
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          XCODE_VER=$(xcodebuild -version)
          echo "$XCODE_VER"
          xcodebuild -showsdks | grep -i iphoneos
          # Chặn nhầm sang Xcode khác 26.x (dùng biến để tránh lỗi Broken pipe khi pipe trực tiếp vào head)
          if ! echo "$XCODE_VER" | grep -q '^Xcode 26\.'; then
            echo "::error::Xcode không thuộc nhánh 26.x ($XCODE_VER)"
            exit 1
          fi

      # Cache kho tải của CocoaPods (không cache thư mục Pods vì prebuild đã tự chạy pod install)
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Sinh dự án iOS (prebuild)
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean

      - name: Build (không ký)
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          # Lấy tên workspace và scheme động sau prebuild
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          if [ "$APP_VARIANT" = "development" ]; then CONFIG=Debug; else CONFIG=Release; fi

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

          # Gói .app thành .ipa chuẩn thương hiệu Beatify
          APP_PATH=$(ls -d build/Build/Products/${CONFIG}-iphoneos/*.app | head -n 1)
          echo "Đã build: $APP_PATH"
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          if [ "$APP_VARIANT" = "development" ]; then
            IPA_FILE="Beatify-Dev.ipa"
          else
            IPA_FILE="Beatify.ipa"
          fi
          zip -qr "$IPA_FILE" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.variant == 'development' && 'Beatify-iOS-Dev' || 'Beatify-iOS-Release' }}
          path: apps/mobile/${{ inputs.variant == 'development' && 'Beatify-Dev.ipa' || 'Beatify.ipa' }}
          retention-days: 14
